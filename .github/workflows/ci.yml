name: CI

# Pull requests run the checks; build-push-image.yml calls this before building on main
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: jdx/mise-action@v5.2.7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck server (including tests)
        run: pnpm --filter server typecheck

      - name: Test server
        run: pnpm --filter server test

      - name: Typecheck web
        run: pnpm --filter web check

      - name: Test web
        run: pnpm --filter web test

      - name: Build web
        run: pnpm --filter web build
